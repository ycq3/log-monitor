name: Go Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: euleros-2.10.1
    steps:
    - uses: checkout-action@0.0.1

    - name: Set up Go
      uses: setup-go@0.0.1
      with:
        go-version: '1.20.7'

    - name: Build
      run:  cd repo_workspace && go build -v ./...

    - name: Test
      run: cd repo_workspace && go test -v ./...
